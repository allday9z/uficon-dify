version: "3.8"

services:
  # -------------------------------------------------------------
  # 1. Reverse Proxy (Nginx) - Routes Web and API traffic
  #    Attach Domain in Coolify UI: https://dify.coolify.pve01.prod.uficon.com (Port 80)
  # -------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
      - web
    networks:
      - coolify
    ports:
      - "80"

  # -------------------------------------------------------------
  # 2. Dify Python API (Backend)
  # -------------------------------------------------------------
  api:
    user: "0:0"
    image: langgenius/dify-api:main
    restart: always
    environment:
      - MODE=api
      - MIGRATION_ENABLED=true
      - SECRET_KEY=${SECRET_KEY}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-1}
      - REDIS_USE_SSL=${REDIS_USE_SSL:-false}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_BACKEND=${CELERY_BACKEND:-redis}
      - BROKER_USE_SSL=${BROKER_USE_SSL:-false}
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=storage
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - CONSOLE_API_URL=${CONSOLE_API_URL:-}
      - CONSOLE_WEB_URL=${CONSOLE_WEB_URL:-}
      - SERVICE_API_URL=${SERVICE_API_URL:-}
      - APP_API_URL=${APP_API_URL:-}
      - APP_WEB_URL=${APP_WEB_URL:-}
      - CONSOLE_CORS_ALLOW_ORIGINS=${CONSOLE_CORS_ALLOW_ORIGINS:-*}
      - WEB_API_CORS_ALLOW_ORIGINS=${WEB_API_CORS_ALLOW_ORIGINS:-*}
      - PLUGIN_DAEMON_URL=http://plugin_daemon:5002
      - PLUGIN_DAEMON_KEY=${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      - INNER_API_KEY_FOR_PLUGIN=${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      - PLUGIN_DIFY_INNER_API_URL=http://api:5001
      - PLUGIN_DIFY_INNER_API_KEY=${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      - MAIL_TYPE
      - MAIL_DEFAULT_SEND_FROM
      - SMTP_SERVER
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_USE_TLS
      - SMTP_USE_SSL
    depends_on:
      - weaviate
      - plugin_daemon
    networks:
      - coolify
    volumes:
      - dify_storage:/app/api/storage

  # -------------------------------------------------------------
  # 3. Dify Celery Worker (Background Tasks)
  # -------------------------------------------------------------
  worker:
    user: "0:0"
    image: langgenius/dify-api:main
    restart: always
    environment:
      - MODE=worker
      - SECRET_KEY=${SECRET_KEY}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-1}
      - REDIS_USE_SSL=${REDIS_USE_SSL:-false}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_BACKEND=${CELERY_BACKEND:-redis}
      - BROKER_USE_SSL=${BROKER_USE_SSL:-false}
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=storage
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - PLUGIN_DAEMON_URL=http://plugin_daemon:5002
      - PLUGIN_DAEMON_KEY=${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      - INNER_API_KEY_FOR_PLUGIN=${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      - PLUGIN_DIFY_INNER_API_URL=http://api:5001
      - PLUGIN_DIFY_INNER_API_KEY=${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      - MAIL_TYPE
      - MAIL_DEFAULT_SEND_FROM
      - SMTP_SERVER
      - SMTP_PORT
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_USE_TLS
      - SMTP_USE_SSL
    depends_on:
      - weaviate
      - plugin_daemon
    networks:
      - coolify
    volumes:
      - dify_storage:/app/api/storage

  # -------------------------------------------------------------
  # 4. Dify Plugin Daemon (Manages LLM Providers, Tools & Plugins)
  # -------------------------------------------------------------
  plugin_daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    restart: always
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_PLUGIN_DATABASE:-${DB_DATABASE}}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - SERVER_PORT=5002
      - SERVER_KEY=${PLUGIN_DAEMON_KEY:-lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi}
      - MAX_PLUGIN_PACKAGE_SIZE=52428800
      - DIFY_INNER_API_URL=http://api:5001
      - DIFY_INNER_API_KEY=${PLUGIN_DIFY_INNER_API_KEY:-QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1}
      - PLUGIN_REMOTE_INSTALLING_HOST=0.0.0.0
      - PLUGIN_REMOTE_INSTALLING_PORT=5003
      - PLUGIN_WORKING_PATH=/app/storage/cwd
      - FORCE_VERIFYING_SIGNATURE=${FORCE_VERIFYING_SIGNATURE:-false}
      - PLUGIN_STORAGE_TYPE=local
      - PLUGIN_STORAGE_LOCAL_ROOT=/app/storage
    volumes:
      - dify_plugin_storage:/app/storage
    networks:
      - coolify

  # -------------------------------------------------------------
  # 5. Dify Frontend (Next.js Web UI)
  # -------------------------------------------------------------
  web:
    image: langgenius/dify-web:main
    restart: always
    environment:
      - CONSOLE_API_URL=${CONSOLE_API_URL:-}
      - APP_API_URL=${APP_API_URL:-}
      - SENTRY_DSN=
    networks:
      - coolify

  # -------------------------------------------------------------
  # 6. Weaviate Vector Database
  # -------------------------------------------------------------
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.2
    restart: always
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=
      - CLUSTER_HOSTNAME=node1
    networks:
      - coolify
    volumes:
      - weaviate_data:/var/lib/weaviate

volumes:
  dify_storage:
  weaviate_data:
  dify_plugin_storage:

networks:
  coolify:
    external: true
